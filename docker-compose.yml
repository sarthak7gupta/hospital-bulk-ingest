services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospital-bulk-processor:latest
    container_name: hospital-bulk-processor
    ports:
      - "8000:8000"
    environment:
      - DIRECTORY_API_BASE_URL=https://hospital-directory.onrender.com
      - MAX_CSV_ROWS=20
      - MAX_CONCURRENT_REQUESTS=5
      - REQUEST_TIMEOUT_SECONDS=15.0
      - MAX_ATTEMPTS=3
      - MAX_RETRIES=3
      - LOG_LEVEL=INFO
      - LOG_JSON=true
    restart: unless-stopped
