name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Run strict type checking
        run: uv run mypy app tests

      - name: Run test suite with coverage enforcement
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t hospital-bulk-processor:test .

      - name: Start container
        run: |
          docker run -d \
            --name test-service \
            -p 8000:8000 \
            -e PORT=8000 \
            -e DIRECTORY_API_BASE_URL=https://hospital-directory.onrender.com \
            hospital-bulk-processor:test

      - name: Verify service liveness and healthcheck
        run: |
          echo "Waiting for service to become responsive..."
          for i in {1..15}; do
            if curl -fs http://localhost:8000/health; then
              echo "Health probe responded successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Service failed to respond within 30 seconds"
          docker logs test-service
          exit 1

      - name: Stop and clean up container
        if: always()
        run: |
          docker stop test-service || true
          docker rm test-service || true
